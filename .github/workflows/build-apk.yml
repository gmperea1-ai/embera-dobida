name: Compilar APK Android Dóbida Aprende

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Dar permisos de ejecución a Gradle
      run: |
        cd android
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew

    - name: Compilar APK (Release / Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Subir APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: Dobida-Aprende-Android-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
